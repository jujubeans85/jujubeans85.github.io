  <style>
    :root { --bg:#0b0b0c; --fg:#f4efe4; --orange:#e85d04; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font-family: Arial Narrow, Arial, sans-serif; overflow:hidden; }
    .stage { min-height:100dvh; position:relative; isolation:isolate; }
    .banner { position:absolute; left:0; right:0; z-index:20; overflow:hidden; white-space:nowrap; letter-spacing:.28em; text-transform:uppercase; font-weight:700; pointer-events:none; }
    .banner-top { top:0; padding:.55rem 0; font-size:clamp(.7rem,2.2vw,.95rem); background:repeating-linear-gradient(90deg,#0b0b0c 0 28px,#e85d04 28px 56px); }
    .banner-bot { bottom:0; padding:.4rem 0; font-size:clamp(.62rem,1.8vw,.8rem); color:#0b0b0c; background:repeating-linear-gradient(90deg,#e85d04 0 22px,#0b0b0c 22px 44px); }
    .track { display:flex; width:max-content; animation:marq 22s linear infinite; }
    .banner-bot .track { animation-direction:reverse; animation-duration:26s; }
    .chunk { padding:0 1.25rem; }
    @keyframes marq { to { transform:translateX(-50%); } }
    .tv { position:absolute; inset:0; display:grid; place-items:center; padding:3.2rem 1rem 3rem; }
    .frame { width:min(92vw,560px); aspect-ratio:1080/1056; border-radius:22px; overflow:hidden; box-shadow:0 0 0 3px var(--orange), 0 0 40px color-mix(in oklab, var(--orange) 45%, transparent); background:#000; }
    .frame.wide { aspect-ratio:16/9; width:min(94vw,920px); }
    video, .frame img { width:100%; height:100%; object-fit:cover; display:block; }
    .era { position:absolute; top:3.6rem; left:1rem; z-index:16; pointer-events:none; }
    .era b { display:block; font-size:clamp(1.6rem,6vw,3rem); letter-spacing:.08em; color:var(--orange); text-shadow:0 2px 12px #000; }
    .era i { font-family:Georgia,serif; font-size:.95rem; opacity:.9; }
    .end { display:none; position:absolute; inset:0; z-index:18; flex-direction:column; align-items:center; justify-content:center; background:repeating-linear-gradient(90deg,#0b0b0c 0 36px,#e85d04 36px 72px); }
    .end.on { display:flex; }
    .end .line { font-family:Georgia,serif; font-style:italic; font-size:clamp(2rem,7vw,3.6rem); margin:0; text-shadow:0 2px 0 #000; }
    .end .who { position:absolute; bottom:4.5rem; letter-spacing:.22em; font-size:.75rem; }
    .fw { position:absolute; inset:0; pointer-events:none; z-index:12; overflow:hidden; }
    .spark { position:absolute; width:8px; height:8px; border-radius:50%; background:var(--orange); animation:burst 1.4s ease-out infinite; box-shadow:0 0 12px var(--orange); }
    .spark:nth-child(2) { background:#f4efe4; animation-delay:.4s; }
    .spark:nth-child(3) { animation-delay:.8s; }
    .spark:nth-child(4) { background:#ff6a00; animation-delay:1.1s; }
    .spark:nth-child(5) { animation-delay:.2s; }
    .spark:nth-child(6) { background:#f4efe4; animation-delay:.7s; }
    @keyframes burst { 0%{transform:scale(.2); opacity:1} 100%{transform:scale(14); opacity:0} }
    .pop { position:absolute; width:10px; height:10px; border-radius:2px; animation:pop 1.1s ease-out infinite; }
    @keyframes pop { 0%{transform:translate(0,0) rotate(0); opacity:1} 100%{transform:translate(var(--dx),var(--dy)) rotate(220deg); opacity:0} }
    button { appearance:none; background:transparent; color:var(--fg); border:1px solid color-mix(in oklab, var(--orange) 70%, #fff); border-radius:999px; padding:.55rem 1rem; letter-spacing:.14em; text-transform:uppercase; font:700 .7rem Arial Narrow, Arial, sans-serif; cursor:pointer; }
    .replay { margin-top:1.6rem; }
  </style>
</head>
<body>
  <main class="stage">
    <div class="banner banner-top"><div class="track" id="t1"></div></div>
    <div class="banner banner-bot"><div class="track" id="t2"></div></div>
    <div class="fw" aria-hidden="true">
      <span class="spark" style="top:10%;left:8%"></span>
      <span class="spark" style="top:16%;left:90%"></span>
      <span class="spark" style="top:78%;left:10%"></span>
      <span class="spark" style="top:84%;left:88%"></span>
      <span class="spark" style="top:6%;left:78%"></span>
      <span class="spark" style="top:88%;left:18%"></span>
      <span class="pop" style="top:20%;left:12%;background:#e85d04;--dx:40px;--dy:-70px"></span>
      <span class="pop" style="top:22%;left:86%;background:#f4efe4;--dx:-50px;--dy:-60px;animation-delay:.3s"></span>
      <span class="pop" style="top:70%;left:14%;background:#ff6a00;--dx:30px;--dy:50px;animation-delay:.6s"></span>
      <span class="pop" style="top:74%;left:88%;background:#e85d04;--dx:-40px;--dy:40px;animation-delay:.9s"></span>
    </div>
    <div class="era" id="era" hidden><b id="eraY"></b><i id="eraC"></i></div>
    <div class="tv">
      <div class="frame" id="frame">
        <video id="v" poster="poster.jpg" playsinline webkit-playsinline muted autoplay preload="auto"></video>
      </div>
    </div>
    <div class="end" id="end">
      <p class="line">enjoy your day</p>
      <button class="replay" type="button" id="replay">Play again</button>
      <p class="who">Adam</p>
    </div>
  </main>
  <script>
    const LINE = "HAPPY BIRTHDAY  -  ENJOY YOUR DAY  -  ROBERT  -  ";
    const html = Array.from({length:8}, () => `<span class="chunk">${LINE}</span>`).join("");
    t1.innerHTML = html + html;
    t2.innerHTML = html + html;

    const CLIPS = [
      { src:"splash.mp4", poster:"poster.jpg", framed:true, hasAudio:true, dur:6.3 },
      { src:"try-1960s.mp4", era:"1960s", caption:"Leichhardt Oval", dur:6.1 },
      { src:"try-1970s.mp4", era:"1970s", caption:"Packed terrace", dur:6.1 },
      { src:"try-1980s.mp4", era:"1980s", caption:"Under the lights", dur:6.1 },
      { src:"try-1990s.mp4", era:"1990s", caption:"Length of the field", dur:6.1 },
      { src:"try-2000s.mp4", era:"2000s", caption:"Corner flag", dur:6.1 },
      { src:"try-2010.mp4", era:"2010", caption:"Last minute", dur:6.1 }
    ];

    const v = document.getElementById("v");
    const frame = document.getElementById("frame");
    const eraBox = document.getElementById("era");
    const end = document.getElementById("end");
    let i = 0, advancing = false, watch = 0, audio = null, soundOk = false;

    function midiToHz(m){ return 440 * 2 ** ((m - 69) / 12); }
    function startMusic(){
      if (audio) { if (audio.state === "suspended") audio.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audio = new AC();
      const master = audio.createGain(); master.gain.value = 0.72;
      const delay = audio.createDelay(0.4); delay.delayTime.value = 0.118;
      const fb = audio.createGain(); fb.gain.value = 0.26;
      delay.connect(fb); fb.connect(delay);
      const dry = audio.createGain(); dry.gain.value = 1;
      const music = audio.createGain(); music.gain.value = 0.62;
      music.connect(dry); music.connect(delay);
      dry.connect(master); delay.connect(master); master.connect(audio.destination);
      const noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
      const nd = noiseBuf.getChannelData(0); for (let n=0;n<nd.length;n++) nd[n] = Math.random()*2-1;
      const blues = [0,0,0,0,5,5,0,0,7,5,0,7];
      let t = audio.currentTime + 0.05, bar = 0, beat = 0;
      function env(when, peak, att, rel){
        const g = audio.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when+att);
        g.gain.exponentialRampToValueAtTime(0.0001, when+att+rel);
        return g;
      }
      function kick(when){
        const o = audio.createOscillator(); o.type="sine";
        o.frequency.setValueAtTime(150, when); o.frequency.exponentialRampToValueAtTime(42, when+0.12);
        const g = env(when, 0.9, 0.002, 0.16); o.connect(g); g.connect(music); o.start(when); o.stop(when+0.2);
      }
      function snare(when){
        const s = audio.createBufferSource(); s.buffer = noiseBuf;
        const f = audio.createBiquadFilter(); f.type="highpass"; f.frequency.value=1200;
        const g = env(when, 0.4, 0.004, 0.09); s.connect(f); f.connect(g); g.connect(music); s.start(when); s.stop(when+0.12);
      }
      function bass(when, midi, dur){
        const o = audio.createOscillator(); o.type="triangle"; o.frequency.value = midiToHz(midi);
        const f = audio.createBiquadFilter(); f.type="lowpass"; f.frequency.value=520;
        const g = env(when, 0.4, 0.005, dur*0.9); o.connect(f); f.connect(g); g.connect(music); o.start(when); o.stop(when+dur);
      }
      function lick(when, midi, dur){
        const o = audio.createOscillator(); o.type="square"; o.frequency.value = midiToHz(midi);
        const f = audio.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1800;
        const g = env(when, 0.1, 0.01, dur); o.connect(f); f.connect(g); g.connect(music); o.start(when); o.stop(when+dur+0.02);
      }
      function tick(){
        const now = audio.currentTime;
        while (t < now + 0.22) {
          const root = 40 + blues[bar % 12];
          const spb = 60/176;
          if (beat===0 || beat===2) kick(t);
          if (beat===1 || beat===3) snare(t);
          bass(t, root + [0,7,12,7][beat], spb*0.85);
          if (Math.random()<0.4) lick(t+spb*0.5, root+12+[0,3,5,7,10][beat], spb*0.35);
          t += spb; beat++; if (beat>=4){ beat=0; bar++; }
        }
        setTimeout(tick, 80);
      }
      tick();
      soundOk = true;
    }

    function showEra(clip){
      if (clip.era) {
        eraY.textContent = clip.era;
        eraC.textContent = clip.caption || "";
        eraBox.hidden = false;
      } else eraBox.hidden = true;
    }

    function goEnd(){
      advancing = true;
      end.classList.add("on");
    }

    function load(idx){
      const clip = CLIPS[idx];
      if (!clip) { goEnd(); return; }
      advancing = false;
      frame.classList.toggle("wide", !clip.framed);
      v.loop = false;
      v.poster = clip.poster || "poster.jpg";
      v.src = clip.src;
      v.muted = !soundOk;
      showEra(clip);
      v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
      clearTimeout(watch);
      watch = setTimeout(() => { if (!advancing) next(); }, (clip.dur + 0.5) * 1000);
    }

    function next(){
      if (advancing) return;
      advancing = true;
      clearTimeout(watch);
      i += 1;
      if (i >= CLIPS.length) goEnd();
      else load(i);
    }

    v.addEventListener("ended", next);
    v.addEventListener("error", next);
    v.addEventListener("loadedmetadata", () => {
      if (v.duration && isFinite(v.duration)) {
        clearTimeout(watch);
        watch = setTimeout(() => { if (!advancing) next(); }, (v.duration + 0.4) * 1000);
      }
    });

    function unlock(){
      v.muted = false;
      startMusic();
      v.play().catch(() => {});
    }
    ["pointerdown","touchstart","keydown","click"].forEach((ev) => {
      window.addEventListener(ev, unlock, { once:true, passive:true });
    });
    document.getElementById("replay").addEventListener("click", () => {
      end.classList.remove("on");
      i = 0; advancing = false; unlock(); load(0);
    });
    unlock();
    load(0);
  </script>
</body>
</html>
