name: DjayKept
options:
  bundleIdPrefix: com.cratejuice
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    APP_GROUP: group.com.cratejuice.djaykept
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DjayKept:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cratejuice.djaykept
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DJAY Kept
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: true
        AppGroupIdentifier: $(APP_GROUP)
    entitlements:
      path: App/DjayKept.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    dependencies:
      - target: KeptBroadcast
        embed: true
  KeptBroadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cratejuice.djaykept.broadcast
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: DJAY Kept Capture
        AppGroupIdentifier: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/KeptBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
  DjayKeptTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DjayKept
schemes:
  DjayKept:
    build:
      targets:
        DjayKept: all
        DjayKeptTests: [test]
    test:
      targets: [DjayKeptTests]
